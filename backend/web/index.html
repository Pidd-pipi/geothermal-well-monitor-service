<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地热井监测</title><style>body{font:15px system-ui;margin:2rem;max-width:1000px;color:#263238}header{border-bottom:2px solid #b85c38;margin-bottom:1rem}section{margin:1.2rem 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;text-align:left;padding:.5rem}button{padding:.3rem .6rem;margin-right:.3rem}input{width:10rem;padding:.3rem}.bad{color:#b71c1c}.ok{color:#1b5e20}</style></head><body><header><h1>地热井监测台</h1><p>井口工况、读数、告警与巡检任务</p></header>
<section><h2>井口工况</h2><table><thead><tr><th>井号</th><th>深度</th><th>压力</th><th>温度</th><th>状态</th><th>操作</th></tr></thead><tbody id="wells"></tbody></table></section>
<section><h2>最新读数</h2><input id="well_id" placeholder="well-07"><button onclick="recent()">查询</button><table><thead><tr><th>井号</th><th>时间</th><th>压力</th><th>温度</th><th>来源</th></tr></thead><tbody id="readings"></tbody></table></section>
<section><h2>未处理告警</h2><table><thead><tr><th>井号</th><th>类型</th><th>阈值</th><th>数值</th><th>时间</th><th>操作</th></tr></thead><tbody id="alerts"></tbody></table></section>
<section><h2>巡检任务</h2><input id="task_well" placeholder="well-12"><input id="task_subject" placeholder="例行巡检"><button onclick="createTask()">新建</button><table><thead><tr><th>任务</th><th>井号</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead><tbody id="tasks"></tbody></table></section>
<p id="message"></p><script src="/app.js"></script></body></html>
